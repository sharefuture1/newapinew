    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>

    <!-- WendingAI (2026-11): static landing shell shown on "/" while the app

    <style>
      #wd-boot{position:fixed;inset:0;z-index:40;overflow:auto;background:#fff;color:#111;font-family:sans-serif}
      html.dark #wd-boot{background:#202020;color:#f2f2f2}
      #wd-boot[hidden]{display:none}
      #wd-boot .wb-bar{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:14px 20px}
      #wd-boot .wb-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:inherit;text-decoration:none}
      #wd-boot .wb-brand img{width:28px;height:28px;border-radius:8px}
      #wd-boot .wb-hero{max-width:1280px;margin:0 auto;padding:96px 20px 48px}
      @media (min-width:640px){#wd-boot .wb-hero{padding-left:32px;padding-right:32px}}
      @media (min-width:768px){#wd-boot .wb-hero{padding-top:128px}}
      /* Same column width as the app hero (lg:col-span-7 of 12, 48px gaps) so
         the heading wraps identically and the hand-over keeps the LCP. */
      @media (min-width:1024px){#wd-boot .wb-col{width:calc((100% - 528px) * 7 / 12 + 288px)}}
      #wd-boot .wb-hdot{display:inline-block;width:.16em;height:.16em;margin-left:.5rem;border-radius:50%;background:#0071bb}

      #wd-boot .wb-dot{width:6px;height:6px;border-radius:50%;background:#0071bb}
      #wd-boot h1{margin:20px 0 0;font-size:clamp(2.75rem,8.5vw,6.25rem);line-height:.92;font-weight:900;letter-spacing:-.035em;overflow-wrap:break-word}
      #wd-boot .wb-muted{color:#5f5f5f}
      #wd-boot ul{display:flex;flex-wrap:wrap;gap:8px 20px;margin:24px 0 0;padding:0;list-style:none;font-size:14px}

    <script>
      ;(function () {
        if (location.pathname !== '/') return
        var boot = document.getElementById('wd-boot')
        if (!boot) return
        // The shell text is Simplified Chinese; other interface languages
        // wait for the app instead of flashing the wrong language.
        var lang = ''
        try {
          lang = localStorage.getItem('i18nextLng') || ''
        } catch (e) {}
        lang = (lang || navigator.language || '').toLowerCase()
        if (lang.indexOf('zh') !== 0 || /^(zhtw|zh-tw|zh-hk|zh-mo|zh-hant)/.test(lang)) return
        try {
          var cached = JSON.parse(localStorage.getItem('status') || 'null')
          var name = cached && cached.system_name
          if (typeof name === 'string' && name) {
            var nodes = boot.querySelectorAll('[data-wd-name]')
            for (var i = 0; i < nodes.length; i++) nodes[i].textContent = name
          }
        } catch (e) {}
        boot.hidden = false
      })()
    </script>
