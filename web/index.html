    <!-- Preload the default mark so LCP is not blocked on CSS/JS discovery.
         Keep the unhashed public path: the backend Logo option and existing
         bookmarks still point at /logo.png. Vercel/Caddy cache headers are
         set separately (hashed /static/* stays immutable; this file is
         long-cached on Vercel and short-cached on the origin). -->
    <link rel="preload" as="image" href="/logo.png" />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!-- Telegram Mini App: only fetch telegram-web-app.js inside Telegram.
         In that environment the script must still run synchronously: it
         reads tgWebAppData from the URL at load time and keeps initData
         in memory; the SPA strips those params when navigating to
         /sign-in, so a later async load would miss them. A normal
         browser never downloads the script. The loader in
         telegram-mini-app.ts stays as a fallback and no-ops once
         window.Telegram.WebApp already exists. -->
    <script>
      ;(function () {
        try {
          var q = String(location.search || '') + String(location.hash || '')
          var ua = String(navigator.userAgent || '')
          var inTelegram =
            /tgWebAppData|tgWebAppPlatform/.test(q) || /Telegram/i.test(ua)
          if (!inTelegram) return
          document.write(
            '<script src="https://telegram.org/js/telegram-web-app.js"><\/script>'
          )
        } catch (e) {}
      })()
    </script>
